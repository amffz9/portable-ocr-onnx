# Modified from nemotron-ocr 2.0.2 (NVIDIA): adds the nemotron_ocr_onnx package,
# onnx/export extras, Windows (.pyd) extension artifacts and licence files in the sdist.
[project]
name = "nemotron-ocr"
version = "2.0.2"
license = "Apache-2.0"
description = "Nemoton OCR"
authors = [{ name = "NVIDIA Nemotron" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "huggingface_hub>=0.20.0",
    "numpy>=1.26.0",
    "pillow>=12.0.0",
    "shapely>=2.1.2,<3",
    "torch~=2.11.0",
    "torchvision~=0.26.0",
]


classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
[project.optional-dependencies]
onnx = ["onnxruntime>=1.20"]
export = ["onnx>=1.16"]

[project.urls]
Homepage = "https://nvidia.com/"

[dependency-groups]
dev = [
    "ipython>=9.6.0",
    "pre-commit>=3.8.0,<4",
    "pytest>=8.3.2,<9",
    "pytest-cov>=5.0.0,<6",
]

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/nemotron_ocr_cpp/*.so", "src/nemotron_ocr_cpp/*.pyd"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/nemotron_ocr",
    "src/nemotron_ocr_cpp",
    "src/nemotron_ocr_onnx",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
dependencies = ["setuptools>=68", "torch>=2.0", "ninja"]

[tool.hatch.build.targets.sdist]
include = [
    "src/**",
    "cpp/**",
    "scripts/**",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE*",
    "LICENSES/**",
    "NOTICE",
    "THIRD_PARTY_NOTICES.md",
]
